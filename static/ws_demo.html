<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Live Feed</title>
    <style>
        :root {
            --bg: #0b1220;
            --card: #0f1724;
            --text: #e6eef6;
            --accent: #38bdf8;
            --success: #4ade80;
            --error: #f87171;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 24px;
        }

        .container { 
            width: 100%;
            max-width: 800px; 
        }

        .card { 
            background: var(--card); 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 { margin: 0; font-size: 1.5rem; }

        #status { 
            font-size: 0.85rem; 
            padding: 4px 12px; 
            border-radius: 20px; 
            background: rgba(0,0,0,0.2);
            font-weight: 600;
        }

        .status-online { color: var(--success); border: 1px solid var(--success); }
        .status-offline { color: var(--error); border: 1px solid var(--error); }

        #log { 
            height: 500px; 
            overflow-y: auto; 
            background: #07111a; 
            padding: 10px; 
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item { 
            padding: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .ts { color: #8fb2d9; font-size: 12px; margin-bottom: 4px; }
        .loc { font-weight: 700; color: var(--accent); }
        b { color: #fff; }

        /* Custom Scrollbar */
        #log::-webkit-scrollbar { width: 6px; }
        #log::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <header>
            <h2>Live Predictions</h2>
            <div id="status" class="status-offline">DISCONNECTED</div>
        </header>
        
        <div id="log"></div>
    </div>
</div>

<script>
    const log = document.getElementById('log');
    const status = document.getElementById('status');
    
    // Use the current host when the page is served from FastAPI static files.
    // Fall back to localhost for direct file:// preview.
    const FALLBACK_HOST = "127.0.0.1:8000";
    const host = window.location.host || FALLBACK_HOST;
    const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const httpProtocol = window.location.protocol === "https:" ? "https:" : "http:";
    const WS_ENDPOINT = `${wsProtocol}//${host}/ws`;
    const RECENT_ENDPOINT = `${httpProtocol}//${host}/recent?limit=25`;
    let socket = null;
    const seen = new Set();

    function entryKey(data) {
        return [data.ts || "", data.location || "", data.predicted_flow ?? "", data.confidence ?? ""].join("|");
    }

    function connect() {
        socket = new WebSocket(WS_ENDPOINT);

        socket.onopen = () => {
            console.log("Connected to Stream");
            status.textContent = "● LIVE";
            status.className = "status-online";
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                addEntryToLog(data, true);
            } catch (err) {
                console.error("Data error:", err);
            }
        };

        socket.onclose = () => {
            status.textContent = "○ RECONNECTING...";
            status.className = "status-offline";
            // Try to reconnect every 3 seconds
            setTimeout(connect, 3000);
        };

        socket.onerror = (err) => {
            console.error("Socket Error:", err);
            socket.close();
        };
    }

    function addEntryToLog(data, prepend = false) {
        const key = entryKey(data);
        if (seen.has(key)) {
            return;
        }
        seen.add(key);

        const div = document.createElement('div');
        div.className = 'item';
        
        // Human-friendly fallback if keys are missing
        const time = data.ts || new Date().toLocaleTimeString();
        const location = data.location || "Unknown Station";
        const flow = data.predicted_flow ?? "N/A";
        const confidence = data.confidence ?? "N/A";

        div.innerHTML = `
            <div class="ts">${time}</div>
            <div>
                <span class="loc">${location}</span> — 
                Flow: <b>${flow}</b> | Conf: <b>${confidence}</b>
            </div>
        `;

        if (prepend) {
            log.prepend(div);
        } else {
            log.appendChild(div);
        }

        // Auto-cleanup: remove oldest items if list exceeds 50
        if (log.children.length > 50) {
            log.removeChild(log.lastChild);
        }
    }

    async function refreshRecent() {
        try {
            const response = await fetch(RECENT_ENDPOINT, { cache: "no-store" });
            if (!response.ok) {
                return;
            }

            const rows = await response.json();
            if (!Array.isArray(rows)) {
                return;
            }

            // Show newest items first, but keep only unseen rows.
            for (const row of rows.reverse()) {
                addEntryToLog(row, true);
            }
        } catch (err) {
            console.warn("Recent refresh failed:", err);
        }
    }

    // Start connection on page load
    connect();
    refreshRecent();
    setInterval(refreshRecent, 5000);
</script>

</body>
</html>
